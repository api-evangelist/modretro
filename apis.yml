apis:
- name: ModRetro Agent Commerce API (UCP over MCP)
  description: >-
    ModRetro's agent-facing commerce API. A remote Model Context Protocol server implementing the
    Universal Commerce Protocol shopping service (versions 2026-04-08 and 2026-01-23), exposing 13
    tools across catalog search and lookup, cart, checkout and order. initialize and tools/list
    answer anonymously; every tools/call requires a fetchable UCP agent-profile URI, and the order
    and checkout tools additionally require a Shopify agent JWT. complete_checkout requires an
    idempotency key and, per ModRetro's own robots.txt and /agents.md, explicit contemporaneous
    human approval of payment.
  humanURL: https://modretro.com/agents.md
  baseURL: https://modretro.com/api/ucp/mcp

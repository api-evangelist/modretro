aid: modretro
name: ModRetro
description: >-
  ModRetro Inc. designs and sells modern recreations of classic game consoles — the Chromatic, an
  FPGA-based Game Boy-compatible handheld, and the M64, a Nintendo 64-style console — along with
  physical cartridges, controllers and accessories. It is a consumer hardware company, not a
  software vendor, and it publishes no developer portal, no OpenAPI and no SDKs. It does, however,
  run a live agent-facing commerce API: its Shopify storefront at modretro.com serves a Universal
  Commerce Protocol (UCP 2026-04-08) merchant profile at /.well-known/ucp and a remote Model Context
  Protocol server at /api/ucp/mcp exposing 13 catalog, cart, checkout and order tools, advertised
  from its own robots.txt, /agents.md and /llms.txt, with idempotency required on checkout
  completion and an explicit human-approval rule on payment. Separately, ModRetro publishes the
  Chromatic's FPGA and MCU design files on GitHub under GPL-3.0 with a dated firmware changelog.
